[tools]
"pipx:check-jsonschema" = "latest"
prek = "0.5.9"
python = "3.12"
uv = "0.12.10"

[tasks.install]
description = "Install prek git shims"
run = [
  "prek install -f"
]

[tasks.clean]
description = "Remove cache files, temporary directories, and build artifacts"
run = """
    rm -rf \
      __pycache__ .pytest_cache .ruff_cache .mypy_cache \
      .coverage htmlcov \
      *.py[cod] *.egg-info dist build
"""

# Useful shortcuts
[tasks.hooks]
description = "Run prek hooks on all files"
run = "prek run --all-files"

[tasks."hooks:update"]
description = "Update prek hook versions (respects cooldown_days)"
run = "prek update"

[tasks.skills-clean]
description = "Preview broken global skill symlinks (asks before removing)"
run = "./scripts/check_broken_skills.py"

[tasks.skills-validate]
description = "Validate skills and plugin manifests with the Claude plugin validator"
run = [
  "claude plugin validate . --profile directory --strict",
  "claude plugin validate skills",
]
